[package]
name = "inklet"
version = "0.1.0"
description = "Desktop overlay drawing board: transparent Excalidraw canvas with passive mouse-through"
edition = "2021"

# ── 跨平台依赖 ──────────────────────────────────────────────
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dirs = "6"
# 生产构建：把 dist/ 嵌入二进制（release 自包含）
include_dir = "0.7"

# ── Linux (Wayland / GTK) ───────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk = "0.18"
glib = "0.18"
gio = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
libc = "0.2"

# ── macOS (AppKit / WKWebView) ──────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
tao = { version = "0.36", features = ["rwh_06"] }
wry = "0.56"
http = "1"
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[dev-dependencies]
tempfile = "3"
